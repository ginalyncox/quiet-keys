<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiet Keys Piano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one screen. One choice or one prompt on top, a live piano always at the bottom.
     One visual world on purpose: a dim practice room, ivory keys, ivory sheet music. */
  --room:#16222b;
  --panel:#203340;
  --line:#3a5666;
  --ivory:#f5efe2;
  --ink:#16222b;
  --text:#eef3f1;
  --muted:#a9bcc4;
  --amber:#f2b84b;
  --note-C:#ff7a6b; --note-D:#ffa94d; --note-E:#ffd84d; --note-F:#7ddc7a;
  --note-G:#4fd1c5; --note-A:#6fb1ff; --note-B:#c59bff;
  --display:"Bricolage Grotesque","Trebuchet MS",Verdana,sans-serif;
  --body:"Atkinson Hyperlegible",Verdana,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--room);color:var(--text);font-family:var(--body);font-size:18px;line-height:1.4;display:flex;justify-content:center;-webkit-tap-highlight-color:transparent}
.app{width:100%;max-width:560px;height:100%;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--note-A);outline-offset:2px}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(10px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 6px calc(16px + env(safe-area-inset-left));min-height:52px}
.brand{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.01em}
.home-btn{background:transparent;border:2px solid var(--line);border-radius:999px;padding:6px 16px;font-weight:700}
.home-btn[hidden]{display:none}

#stage > *{flex-shrink:0}
#stage{flex:1;min-height:0;overflow-y:auto;padding:6px calc(16px + env(safe-area-inset-right)) 12px calc(16px + env(safe-area-inset-left));display:flex;flex-direction:column;gap:12px}
h1{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.1;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:20px;margin:0;color:var(--muted)}
p{margin:0}
.muted{color:var(--muted);font-size:16px}
.rowline{display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap}

/* Big choices look like piano keys lying on their side */
.slabs{display:flex;flex-direction:column;gap:9px}
.slab{background:var(--ivory);color:var(--ink);border:0;border-radius:6px 16px 16px 6px;border-left:10px solid var(--tab,var(--note-G));padding:10px 16px;text-align:left;display:flex;flex-direction:column;gap:2px;box-shadow:0 4px 0 #0c1419}
.slab:active{transform:translateY(3px);box-shadow:0 1px 0 #0c1419}
.slab b{font-family:var(--display);font-weight:800;font-size:21px}
.slab span{font-size:16px}
.done-mark{font-weight:700;font-size:14px;background:var(--ivory);color:var(--ink);border-radius:999px;padding:1px 10px;flex:none}

/* Lesson and song lists */
.lvl{display:flex;flex-direction:column;gap:6px}
.lvl h2{color:var(--text)}
.rows{display:flex;flex-direction:column;gap:6px}
.rowbtn{background:var(--panel);border:0;border-radius:10px;padding:11px 14px;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:10px}
.rowbtn:active{background:var(--line)}

.dots{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}
.dot.full{background:var(--ivory);border-color:var(--ivory)}
.dot.here{border-color:var(--ivory)}

.ask{display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:800;font-size:30px}
.big{min-width:60px;height:60px;padding:0 8px;border-radius:30px;background:var(--nc);color:var(--ink);display:grid;place-items:center;font-size:34px;font-family:var(--display);font-weight:800;flex:none}
.hint{background:var(--panel);border-radius:14px;padding:10px 14px}
.msg{min-height:26px;font-weight:700}

.chips{display:flex;flex-wrap:wrap;gap:5px;align-items:flex-end;min-height:44px}
.chip{height:40px;border-radius:9px;background:var(--nc);color:var(--ink);display:grid;place-items:center;font-weight:700;font-size:17px;opacity:.45;flex:none}
.chip.hi{border-top:5px solid var(--ivory)}
.chip.lo{border-bottom:5px solid var(--ivory)}
.chip.done{opacity:1}
.chip.off{opacity:1;background:transparent;border:2px dashed var(--nc);color:var(--text)}
.chip.now{opacity:1;box-shadow:0 0 0 3px var(--room),0 0 0 6px var(--ivory)}
.chip.sm{height:28px;width:auto !important;min-width:28px;padding:0 5px;font-size:14px;opacity:1}
.cw{display:inline-flex;flex-direction:column;gap:4px;padding-top:26px;position:relative}
.tag{position:absolute;top:0;left:0;height:22px;min-width:22px;padding:0 4px;border:2px solid var(--ivory);border-radius:5px;font-size:13px;line-height:18px;font-weight:700;text-align:center;color:var(--ivory);white-space:nowrap}

/* Sheet music is ink on ivory paper */
.staffbox{background:var(--ivory);border-radius:12px;padding:4px 6px;overflow-x:auto;flex:none;line-height:0}
.staffbox.solo{align-self:flex-start}

.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{background:var(--ivory);color:var(--ink);border:0;border-radius:12px;padding:11px 16px;font-weight:700;box-shadow:0 4px 0 #0c1419}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0c1419}
.btn.ghost{background:transparent;color:var(--text);border:2px solid var(--line);box-shadow:none}
.btn[disabled]{opacity:.5}

/* Piano */
.bed{flex:0 0 38%;min-height:185px;max-height:360px;display:flex;flex-direction:column;padding:0 calc(8px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left))}
.shift{display:flex;justify-content:space-between;gap:8px;min-height:0}
.shift button{background:transparent;border:2px solid var(--line);border-radius:999px;padding:2px 12px;font-size:14px;font-weight:700;margin-bottom:4px}
.shift button[hidden]{display:none}
.shift button[disabled]{opacity:.35}
#piano{flex:1;min-height:0;display:flex;gap:3px;touch-action:none;user-select:none;-webkit-user-select:none}
.oct{flex:1;min-width:0;display:none;flex-direction:column}
.oct.on{display:flex}
.cap{font-size:13px;font-weight:700;color:var(--muted);text-align:center;line-height:16px;flex:none}
.groups{position:relative;height:22px;flex:none}
.groups span{position:absolute;bottom:0;height:19px;border:2px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0;font-size:13px;line-height:15px;text-align:center;color:var(--muted);font-weight:700}
.keys{position:relative;flex:1;min-height:0;display:flex;gap:3px;border-top:6px solid #7a1f2b}
.key{border:0;padding:0;margin:0}
.key.white{flex:1;min-width:0;background:var(--ivory);border-radius:0 0 9px 9px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;transition:background .12s}
.key.black{position:absolute;top:0;height:60%;width:8.6%;background:#0c1419;border-radius:0 0 6px 6px;transform:translateX(-50%);z-index:2;border:1px solid #2a3f4c;border-top:0}
.label{width:32px;height:32px;max-width:90%;border-radius:50%;background:var(--nc);color:var(--ink);font-weight:700;font-size:18px;display:grid;place-items:center;pointer-events:none}
#piano.hide-labels .label{visibility:hidden}
#piano.hide-labels .key.target .label{visibility:visible}
.key.white.lit,.key.white.target,.key.white.hold{background:var(--nc)}
.key.white.lit .label,.key.white.target .label,.key.white.hold .label{background:var(--ink);color:var(--ivory)}
.key.black.lit,.key.black.target,.key.black.hold{background:var(--amber)}
.key.white.target{animation:glow 1.1s ease-in-out infinite}
.key.black.target{animation:glowb 1.1s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:inset 0 0 0 4px var(--ink)}50%{box-shadow:inset 0 0 0 9px var(--ink)}}
@keyframes glowb{0%,100%{box-shadow:0 0 0 2px var(--ivory)}50%{box-shadow:0 0 0 6px var(--ivory)}}
@media (orientation:landscape) and (min-width:600px){
  .app{max-width:1000px}
  .bed{flex-basis:50%;min-height:150px}
  header{min-height:40px;padding-top:calc(6px + env(safe-area-inset-top));padding-bottom:2px}
  .slabs{display:grid;grid-template-columns:1fr 1fr}
  .rows{display:grid;grid-template-columns:1fr 1fr}
  h1{font-size:24px}
}
@media (orientation:landscape) and (min-width:1000px){
  .app{max-width:1400px}
  .bed{flex-basis:42%}
}
/* A phone held sideways is wide but very short: give the piano most of the height */
@media (orientation:landscape) and (max-height:500px){
  header{min-height:0;padding-top:calc(4px + env(safe-area-inset-top));padding-bottom:0}
  .brand{font-size:16px}
  .home-btn{padding:1px 12px;font-size:14px}
  #stage{gap:6px;padding-top:2px;padding-bottom:4px;font-size:15px}
  h1{font-size:20px}
  h2{font-size:16px}
  .muted{font-size:14px}
  .ask{font-size:20px;gap:8px}
  .big{min-width:38px;height:38px;font-size:22px}
  .msg{min-height:20px}
  .hint{padding:6px 10px}
  .slab{padding:6px 12px}
  .slab b{font-size:17px}
  .slab span{font-size:14px}
  .rowbtn{padding:7px 12px}
  .chip{height:32px;font-size:15px}
  .btn{padding:6px 12px}
  .bed{flex-basis:60%;min-height:0;position:relative;padding-bottom:calc(4px + env(safe-area-inset-bottom))}
  .shift{position:absolute;left:calc(8px + env(safe-area-inset-left));right:calc(8px + env(safe-area-inset-right));top:-3px;pointer-events:none;z-index:3}
  .shift button{pointer-events:auto;padding:0 10px;font-size:12px;margin:0;background:var(--room)}
  .groups{height:18px}
  .groups span{height:16px;line-height:12px;font-size:12px}
  .label{width:26px;height:26px;font-size:15px}
  .key.white{padding-bottom:6px}
}
@media (prefers-reduced-motion:reduce){
  .key.white.target{animation:none;box-shadow:inset 0 0 0 6px var(--ink)}
  .key.black.target{animation:none;box-shadow:0 0 0 4px var(--ivory)}
  .slab:active,.btn:active{transform:none}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">Quiet Keys</div>
    <button class="home-btn" id="homeBtn" data-act="home" hidden>Home</button>
  </header>

  <main id="stage" aria-live="polite"></main>

  <div class="bed">
    <div class="shift">
      <button id="winDown" data-act="win-down" hidden>&#9666; lower keys</button>
      <button id="winUp" data-act="win-up" hidden>higher keys &#9656;</button>
    </div>
    <div id="piano" role="group" aria-label="Piano keys"></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ================= notes ================= */
  var LETTERS = ["C","D","E","F","G","A","B"];
  var NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
  var FLAT = {Db:"C#", Eb:"D#", Gb:"F#", Ab:"G#", Bb:"A#"};
  var OCTS = [-1, 0, 1];                       // 0 starts at middle C
  var OCT_NAME = {"-1":"lower keys", "0":"middle keys", "1":"higher keys"};
  var FINGER = ["", "thumb", "pointer finger", "middle finger", "ring finger", "pinky"];
  var BEAT = 0.5;                              // seconds for one plain note
  var HANDS = ["right","left","both"];

  /* "F#'" = F sharp in the higher keys, "G," = G in the lower keys */
  function N(tok){
    var m = /^([A-G])(#|b)?([',]*)$/.exec(tok);
    var name = m[1] + (m[2] || ""), key = FLAT[name] || name, oct = 0;
    for(var i = 0; i < m[3].length; i++) oct += m[3][i] === "'" ? 1 : -1;
    return {name:name, key:key, letter:m[1], acc:m[2] || "", oct:oct, pc:NAMES.indexOf(key)};
  }
  function show(name){ return name.replace("#", "♯").replace("b", "♭"); }
  function say(name){ return name[0] + (name[1] === "#" ? " sharp" : name[1] === "b" ? " flat" : ""); }
  function midiOf(n, shift){ return 60 + (n.oct + (shift || 0)) * 12 + n.pc; }

  /* "E:2@C" = note E, held for two plain notes, left-hand chord changes to C here */
  function line(s){
    return s.split(" ").map(function(t){
      var a = t.split("@"), p = a[0].split(":");
      return {n:N(p[0]), b:p[1] ? parseFloat(p[1]) : 1, ch:a[1] || null};
    });
  }
  function quick(s, ch){ return s.split(" ").map(function(t, i){ return t + ":.5" + (i === 0 && ch ? "@" + ch : ""); }).join(" "); }

  var WHERE = {
    C:"C is the white key just left of the black pair.",
    D:"D sits in the middle of the black pair.",
    E:"E is the white key just right of the black pair.",
    F:"F is the white key just left of the black trio.",
    G:"G sits inside the black trio, on the left side.",
    A:"A sits inside the black trio, on the right side.",
    B:"B is the white key just right of the black trio."
  };
  function whereIs(n){
    if(n.acc === "#") return say(n.name) + " is the black key just right of " + n.letter + ".";
    if(n.acc === "b") return say(n.name) + " is the black key just left of " + n.letter + ".";
    return WHERE[n.letter];
  }

  /* ================= chords (close shapes so the left hand barely moves) ================= */
  var CH = {
    C:  {say:"C",         notes:["C","E","G"],       f:[5,3,1]},
    F:  {say:"F",         notes:["C","F","A"],       f:[5,2,1]},
    G:  {say:"G",         notes:["D","G","B"],       f:[5,2,1]},
    Am: {say:"A minor",   notes:["C","E","A"],       f:[5,3,1]},
    Dm: {say:"D minor",   notes:["D","F","A"],       f:[5,3,1]},
    Em: {say:"E minor",   notes:["E","G","B"],       f:[5,3,1]},
    D:  {say:"D",         notes:["D","F#","A"],      f:[5,3,1]},
    A:  {say:"A",         notes:["C#","E","A"],      f:[5,3,1]},
    E:  {say:"E",         notes:["E","G#","B"],      f:[5,3,1]},
    G7: {say:"G seventh", notes:["D","F","G","B"],   f:[5,3,2,1]},
    C7: {say:"C seventh", notes:["C","E","G","Bb"],  f:[5,3,2,1]},
    D7: {say:"D seventh", notes:["C","D","F#","A"],  f:[5,4,2,1]}
  };
  Object.keys(CH).forEach(function(id){ CH[id].n = CH[id].notes.map(N); });

  /* ================= songs (traditional or public domain) ================= */
  var JB1 = "E@C E E:2 E E E:2", JB2 = "E@C G C:1.5 D:.5 E:4", JB3 = "F@F F F:1.5 F:.5 F@C E E E:.5 E:.5";
  var OS1 = "C:.5@C D:.5 E G G:1.5 A:.5 G E C:1.5 D:.5", OS2 = "E@C E D@G D C:3@C";
  var GS1 = "A@Am C':2 D' E':1.5 F#':.5 E' D':2@G B G:1.5 A:.5 B";
  var PR1 = quick("C E G C' E' G C' E' C E G C' E' G C' E'", "C");
  var SONG_LIST = [
    {name:"Hot Cross Buns", five:true, lines:[
      "E@C D@G C:2@C", "E@C D@G C:2@C", "C:.5@C C:.5 C:.5 C:.5 D:.5@G D:.5 D:.5 D:.5", "E@C D@G C:2@C"]},
    {name:"Mary Had a Little Lamb", five:true, lines:[
      "E@C D C D E E E:2", "D@G D D:2 E@C G G:2", "E@C D C D E E E E", "D@G D E D C:4@C"]},
    {name:"Twinkle Twinkle Little Star", five:true, lines:[
      "C@C C G G A@F A G:2@C", "F@F F E@C E D@G D C:2@C", "G@C G F@F F E@C E D:2@G",
      "G@C G F@F F E@C E D:2@G", "C@C C G G A@F A G:2@C", "F@F F E@C E D@G D C:2@C"]},
    {name:"London Bridge", five:true, lines:[
      "G@C A G F E F G:2", "D@G E F:2 E@C F G:2", "G@C A G F E F G:2", "D:2@G G:2 E@C C:2"]},
    {name:"Ode to Joy", five:true, lines:[
      "E@C E F G G@G F E D", "C@C C D E E:1.5@G D:.5 D:2", "E@C E F G G@G F E D", "C@C C D E D:1.5@G C:.5 C:2@C"]},
    {name:"Oh! Susanna", five:true, lines:[
      OS1, "E@C E D C D:3@G", OS1, OS2, "F:2@F F:2 A A:2 A", "G@C G E C D:3@G", OS1, OS2]},
    {name:"Jingle Bells", five:true, lines:[
      JB1, JB2, JB3, "E@G D D E D:2 G:2", JB1, JB2, JB3, "G@G G F D C:4@C"]},
    {name:"When the Saints Go Marching In", five:true, lines:[
      "C@C E F G:4", "C@C E F G:4", "C@C E F G:2 E:2 C:2 E:2 D:4@G",
      "E@C E D C:3 C E:2 G:2 G F:4@F", "E@C F G:2 E:2 C:2@G D:2 C:4@C"]},
    {name:"Largo from the New World Symphony", five:true, lines:[
      "E:1.5@C G:.5 G:2 E:1.5 D:.5 C:2", "D:1.5@G E:.5 G:1.5 E:.5 D:4",
      "E:1.5@C G:.5 G:2 E:1.5 D:.5 C:2", "D@G E D:1.5 C:.5 C:4@C"]},
    {name:"Row, Row, Row Your Boat", lines:[
      "C:1.5@C C:1.5 C D:.5 E:1.5", "E@C D:.5 E F:.5 G:3",
      "C':.5@C C':.5 C':.5 G:.5 G:.5 G:.5 E:.5 E:.5 E:.5 C:.5 C:.5 C:.5", "G@G F:.5 E D:.5 C:3@C"]},
    {name:"Frère Jacques", lines:[
      "C'@C D' E' C' C' D' E' C'", "E'@C F' G':2 E' F' G':2",
      "G':.5@C A':.5 G':.5 F':.5 E' C' G':.5 A':.5 G':.5 F':.5 E' C'", "C'@C G@G C':2@C C' G@G C':2@C"]},
    {name:"Yankee Doodle", lines:[
      "C'@C C' D' E' C' E' D'@G G", "C'@C C' D' E' C':2 B:2@G",
      "C'@C C' D' E' F'@F E' D' C'", "B@G G A B C':2@C C':2"]},
    {name:"Happy Birthday", lines:[
      "G:.75@C G:.25 A G C' B:2@G", "G:.75@G G:.25 A G D' C':2@C",
      "G:.75@C G:.25 G' E' C' B A@F", "F':.75@F F':.25 E'@C C' D'@G C':2@C"]},
    {name:"Amazing Grace", lines:[
      "G@C C':2 E':.5 C':.5 E':2 D' C':2@F A G:2@C", "G@C C':2 E':.5 C':.5 E':2 D' G':5@G",
      "E'@C G':2 E':.5 C':.5 E':2 D' C':2@F A G:2@C", "G@C C':2 E':.5 C':.5 E':2 D'@G C':4@C"]},
    {name:"Auld Lang Syne", lines:[
      "G@C C':1.5 C':.5 C' E' D':1.5@G C':.5 D' E'", "C':1.5@C C':.5 E' G' A':3@F A'",
      "G':1.5@C E':.5 E' C' D':1.5@G C':.5 D' E'", "C':1.5@F A:.5 A G@G C':3@C"]},
    {name:"Minuet in G (opening)", lines:[
      "D'@G G:.5 A:.5 B:.5 C':.5 D' G G", "E'@C C':.5 D':.5 E':.5 F#':.5 G'@G G G",
      "C'@C D':.5 C':.5 B:.5 A:.5 B@G C':.5 B:.5 A:.5 G:.5", "F#@D G:.5 A:.5 B:.5 G:.5 A:3"]},
    {name:"Greensleeves", lines:[
      GS1, "C':2@Am A A:1.5 G#:.5 A B:2@E G# E:2", GS1, "C':1.5@Am B:.5 A G#:1.5@E F#:.5 G# A:3@Am"]},
    {name:"Für Elise (opening)", lines:[
      "E':.5@Am D#':.5 E':.5 D#':.5 E':.5 B:.5 D':.5 C':.5 A:1.5",
      "C:.5@Am E:.5 A:.5 B:1.5@E E:.5 G#:.5 B:.5 C':1.5@Am",
      "E:.5@Am E':.5 D#':.5 E':.5 D#':.5 E':.5 B:.5 D':.5 C':.5 A:1.5",
      "C:.5@Am E:.5 A:.5 B:1.5@E E:.5 C':.5 B:.5 A:2@Am"]},
    {name:"Prelude in C (opening)", lines:[
      PR1, quick("C D A D' F' A D' F' C D A D' F' A D' F'", "Dm"),
      quick("B, D G D' F' G D' F' B, D G D' F' G D' F'", "G7"), PR1]}
  ];
  var SONG = {};
  SONG_LIST.forEach(function(s){
    s.lines = s.lines.map(line);
    s.lo = 9; s.hi = -9;
    s.lines.forEach(function(L){ L.forEach(function(x){ s.lo = Math.min(s.lo, x.n.oct); s.hi = Math.max(s.hi, x.n.oct); }); });
    SONG[s.name] = s;
  });

  /* ================= scales (fingers are stored as 1 = thumb ... 5 = pinky, never shown as numbers) ================= */

  /* ================= sound ================= */
  var ctx = null;
  function audio(){
    if(!ctx){ var AC = window.AudioContext || window.webkitAudioContext; if(AC){ try{ ctx = new AC(); }catch(e){ ctx = null; } } }

  function tone(midi, dur, vol){
    var c = audio(); if(!c) return;

    var g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);

    o1.start(t); o2.start(t); o1.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
  }

  /* ---- copy me ---- */

      h += '<div class="actions">';
      h += '<button class="btn" data-act="home">Stop here</button>';
      if(S.L && nx2) h += '<button class="btn ghost" data-act="lesson" data-id="' + nx2.id + '">Next lesson</button>';
      h += '<button class="btn ghost" data-act="again">Go again</button>';
      h += '</div>';
      if(S.L && nx2) h += '<p class="muted">Next up: ' + nx2.title + '</p>';
    }

    stage.innerHTML = h;

    placeWindow(need(), free);
    var t = targets(), hd = holds();
    OCTS.forEach(function(o){
      Object.keys(keyEls[o]).forEach(function(k){
        var el = keyEls[o][k];
        el.classList.toggle("target", t.some(function(x){ return x.key === k && Math.max(-1, Math.min(1, x.oct)) === o; }));
        el.classList.toggle("hold", o === -1 && hd.indexOf(k) !== -1);
      });
    });
    piano.classList.toggle("hide-labels", S.view === "find");
  }

  document.addEventListener("click", function(e){
    var b = e.target.closest("[data-act]"); if(!b || b.disabled) return;
    audio(); // unlock sound on the first tap
    var a = b.dataset.act;
    if(a === "home"){ ++run; S = {view:"home"}; render(); }
    else if(a === "lessons"){ ++run; S = {view:"lessons"}; render(); }
    else if(a === "songs"){ ++run; S = {view:"songs"}; render(); }
    else if(a === "lesson") startLesson(LBY[b.dataset.id]);
    else if(a === "song") startSong(SONG_LIST[parseInt(b.dataset.i, 10)], null);
    else if(a === "again"){ if(S.L) startLesson(S.L); else if(S.song) startSong(S.song, null); }
    else if(a === "echo-again") showEcho();
    else if(a === "midi") connectMidi();
    else if(a === "win-down"){ winManual = Math.max(-1, winStart - 1); render(); }
    else if(a === "win-up"){ winManual = Math.min(1, winStart + 1); render(); }
    else if(a === "hear") hearLine();
    else if(a === "along") playAlong();
    else if(a === "time") playInTime();
    else if(a === "hands"){
      var opts = S.song.scale ? ["right","left"] : HANDS;
      save.hands = opts[(opts.indexOf(save.hands) + 1) % opts.length]; keep(); render();
    }
    else if(a === "speed"){ save.fast = !save.fast; keep(); render(); }
    else if(a === "staff"){ save.staff = !save.staff; keep(); render(); }
    else if(a === "stop"){ stopAll(); S.marks = null; S.pos = 0; S.msg = ""; render(); }
    else if(a === "line-again"){ S.pos = 0; S.lineDone = false; S.marks = null; S.msg = ""; render(); }
    else if(a === "next-line"){
      if(S.line >= S.song.lines.length - 1) finish();
      else { S.line++; S.pos = 0; S.lineDone = false; S.marks = null; S.msg = ""; S.chordNow = null; render(); if(S.along) playAlong(); }
    }
  });

  window.__qk = {state:function(){ return S; }}; // used by the automated lesson check
  render();
})();
</script>
</body>
</html>
